name: CI

on:
  push:
    branches: [main, master, "feat/**", "release/**"]
  pull_request:
    branches: [main, master, "feat/**", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pyyaml

      - name: Validate metadata, requirements, schema, and syntax
        run: |
          python -m compileall -q main.py migration.py reload_bootstrap.py core storage api tools/package_release.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import yaml

          root = Path(".")
          meta = yaml.safe_load((root / "metadata.yaml").read_text(encoding="utf-8"))
          for field in ("name", "version", "author", "desc", "astrbot_version", "repo"):
              assert meta.get(field), f"metadata.yaml missing required field: {field}"
          pkg = json.loads((root / "package.json").read_text(encoding="utf-8"))
          assert str(pkg["version"]) == str(meta["version"]), "package.json version drift"

          bm_text = (root / "core/managers/backup_manager.py").read_text(encoding="utf-8")
          bm_match = re.search(r'^PLUGIN_VERSION\s*=\s*"([^"]+)"', bm_text, re.M)
          if bm_match:
              assert bm_match.group(1) == str(meta["version"]), "PLUGIN_VERSION drift"
          else:
              assert "PLUGIN_VERSION = _read_plugin_version()" in bm_text, "PLUGIN_VERSION missing"
              assert "metadata.yaml" in bm_text, "backup_manager.py must read version from metadata.yaml"

          reqs = [
              line.strip()
              for line in (root / "requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          assert reqs, "requirements.txt must not be empty"
          for line in reqs:
              assert re.match(r"^[A-Za-z0-9_.-]+(\[[A-Za-z0-9_,.-]+\])?([<>=!~].+)?$", line), (
                  f"Invalid requirement line: {line}"
              )
          json.loads((root / "_conf_schema.json").read_text(encoding="utf-8"))
          print("Metadata, requirements, and schema checks OK.")
          PY

      - name: Run offline pytest regression suites
        run: |
          python -m pytest -q \
            tests/test_batch2_storage_and_integrity.py \
            tests/test_batch3_recall_and_runtime.py \
            tests/test_batch4_packaging_and_ci.py \
            tests/test_graph_memory.py \
            tests/test_graph_store_subgraph.py \
            tests/test_atom_store_fts.py \
            tests/test_bm25_cjk_bigrams.py \
            tests/test_memory_engine.py \
            tests/test_memory_engine_crud_unit.py \
            tests/test_backup_manager.py \
            tests/test_evidence_schema_upgrade_contract.py \
            tests/test_page_api_update_extra.py \
            tests/test_decay_scheduler.py \
            tests/test_decay_scheduler_extended.py \
            tests/test_sqlite_connection.py \
            tests/test_sqlite_write_reliability.py \
            tests/test_engine_transaction_isolation.py \
            tests/test_conversation_store.py \
            tests/test_series_and_faiss_unit.py \
            tests/test_consolidation_manager.py \
            tests/test_managed_reflection_recovery.py \
            tests/test_memory_processor.py \
            tests/test_memory_processor_regressions.py \
            tests/test_plugin_helpers_unit.py \
            tests/test_r2_r3_optimizations.py \
            tests/test_rerank_cost_guard.py \
            tests/test_rerank_diagnostic.py \
            tests/test_retrieval_components.py \
            tests/test_score_fusion.py \
            tests/test_release_workflow.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check dashboard bundles
        run: npm run check:dashboard

      - name: Run frontend tests
        run: npm run test:frontend

  package-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and verify install archive hygiene
        run: |
          python tools/package_release.py --output dist-ci
          python - <<'PY'
          import glob
          import zipfile
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools")
          import package_release

          archives = glob.glob("dist-ci/*-install.zip")
          assert len(archives) == 1, f"Expected 1 install archive, got {archives}"
          with zipfile.ZipFile(archives[0]) as zf:
              names = zf.namelist()
              package_release.verify_install_archive_members(
                  names, "astrbot_plugin_dynamics_memory"
              )
              assert "astrbot_plugin_dynamics_memory/pages/dashboard/assets/app.min.js" in names
              print(f"Verified {archives[0]}: {len(names)} clean runtime files.")
          PY
